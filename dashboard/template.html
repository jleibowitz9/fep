<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEP Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Midnight Green #004C54 is the brand, so it owns the sidebar and the
     primary action and nothing else. The working surface is neutral, because
     a green canvas competes with the twelve competitor colours and with the
     green/red of the deltas, which is exactly the information you need to read
     fastest. Brand on the rail, data on neutral ground. */
  --eagles:#004C54; --eagles-lo:#003B41; --eagles-hi:#00646E; --silver:#A5ACAF;
  --bg:#0C0E10; --panel:#141719; --panel2:#1A1E21; --line:#262B2F; --line2:#394046;
  --ink:#E9ECEE; --dim:#98A1A8; --dim2:#69737B;
  --green:#35D28A; --red:#FF6E79; --amber:#F2B33D; --blue:#4aa8ff; --violet:#a78bfa;
  /* Space Grotesk ships 300..700 and Space Mono only 400 and 700, so nothing
     here asks for 800: the browser would synthesise it and the result is
     mushy at the small sizes this interface uses. */
  --sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --rail:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------------- sidebar ---------------- */
aside{width:var(--rail);flex:none;background:var(--eagles);border-right:1px solid var(--eagles-lo);
  display:flex;flex-direction:column;padding:16px 12px;
  background-image:linear-gradient(180deg,#005760 0%,#004C54 42%,#003B41 100%)}
.brand{padding:2px 6px 18px}
/* The wordmark is a transparent white 902x337 PNG, so it sits straight on the
   green rail at its own aspect ratio. The square icon slot squashed it. */
.brand .mark{display:block;height:34px;margin-bottom:7px}
.brand .mark img{height:100%;width:auto;display:block}
.brand .mark.fallback{width:32px;border-radius:8px;background:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--eagles)}
.brand h1{font-size:14px;font-weight:700;letter-spacing:-.1px;color:#fff}
.brand span{display:block;font-size:11px;color:#8FB4B8;font-weight:500}

.weekpick{background:#00000026;border:1px solid #ffffff1f;border-radius:var(--r);
  padding:10px 12px;margin-bottom:16px}
.weekpick .lab{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#8FB4B8;font-weight:700}
.weekpick .val{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.weekpick .val b{font-size:21px;font-weight:700;letter-spacing:-.4px}
.weekpick .val em{font-style:normal;font-size:12px;color:#B7D2D5}
.weekpick .opp{margin-top:6px;font-size:12px;color:#B7D2D5;display:flex;align-items:center;gap:6px}

nav{display:flex;flex-direction:column;gap:1px}
nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:#BCD6D9;font-size:13px;font-weight:500;text-align:left;transition:.12s}
nav button:hover{background:#ffffff14;color:#fff}
nav button.on{background:#ffffff26;color:#fff;font-weight:600}
nav button .k{margin-left:auto;font-size:10px;color:#7FA6AB;font-family:var(--mono)}
nav button .ic{width:15px;text-align:center;opacity:.9}
nav .sep{height:1px;background:#ffffff1f;margin:10px 6px}

.side-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid #ffffff1f;
  font-size:11px;color:#8FB4B8;line-height:1.7}
.side-foot .row{display:flex;justify-content:space-between;gap:8px}
.side-foot b{color:#DCEAEB;font-weight:600}

/* ---------------- main ---------------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:60px;flex:none;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:14px;padding:0 24px;background:var(--panel)}
header h2{font-size:16px;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--dim)}
.pills{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:5px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.pill .dot{width:6px;height:6px;border-radius:99px;background:var(--dim2)}
.pill.ok{color:#8FE9C4;border-color:#0C5F4C}.pill.ok .dot{background:var(--green)}
.pill.warn{color:#F7D79B;border-color:#5A4614}.pill.warn .dot{background:var(--amber)}
.btn{background:var(--eagles);color:#fff;font-weight:700;font-size:13px;padding:8px 15px;
  border-radius:8px;transition:.12s;border:1px solid var(--eagles-hi)}
.btn:hover{background:var(--eagles-hi)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);font-weight:600}
.btn.ghost:hover{background:var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

.scroll{flex:1;overflow-y:auto;padding:28px;scroll-behavior:smooth}
.view{max-width:1440px;margin:0 auto}
.view{display:none;animation:in .18s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------------- primitives ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card > h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card > h3 .tag{margin-left:auto;font-size:10px;text-transform:none;letter-spacing:0;color:var(--dim2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1180px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
.mt{margin-top:14px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);
  font-weight:700;text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #21262A}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1A1E21}
.name{font-weight:600;cursor:pointer}
.name:hover{color:var(--green)}
/* The name pill is lifted from the Framer site, where each competitor already
   owns a colour. It carries the brand without tinting the whole surface. */
.pillname{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:700;
  font-size:11px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
  color:#0C0E10;transition:.12s}
.pillname:hover{filter:brightness(1.12)}
.pillname.out{background:#2A3035!important;color:var(--dim2)!important;text-decoration:line-through}
/* Both declarations must be !important. The pill's ink is set inline and is
   chosen for the competitor's own colour, so without this an eliminated Amir
   kept white ink while an eliminated Jay kept near-black, on the same grey. */
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--dim2)}
.muted{color:var(--dim)}.tiny{font-size:11px}
.dead{color:var(--dim2);text-decoration:line-through}

.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
/* The odds figure sits on its own bar, so the magnitude reads at a glance
   without spending a column that collapses on a narrow window. */
.oddscell{position:relative;isolation:isolate}
.oddscell::before{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:3px;
  border-radius:99px;background:var(--line);z-index:-1}
.oddscell::after{content:"";position:absolute;left:6px;bottom:4px;height:3px;width:var(--w);
  max-width:calc(100% - 12px);border-radius:99px;background:var(--c);opacity:.85;z-index:-1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.6px;font-family:var(--mono)}
.stat .l{font-size:11px;color:var(--dim);font-weight:500}

.wl{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;
  font-size:10px;font-weight:700;font-family:var(--mono)}
.wl.W{background:#0C5F4C;color:#9CF0CE}.wl.L{background:#5C1A24;color:#FFBFC4}
.wl.A{background:var(--line);color:var(--dim2)}

/* ---------------- run / verify ---------------- */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #21262A}
.step:last-child{border-bottom:none}
.step .ic{width:20px;height:20px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--line);color:var(--dim2);margin-top:1px}
.step.ok .ic{background:#0C5F4C;color:var(--green)}
.step.warn .ic{background:#5A4614;color:var(--amber)}
.step .t{font-weight:600;font-size:13px}
.step .d{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.55}
.step .d code{font-family:var(--mono);font-size:11px;color:#B7C4CB;background:#20262B;
  padding:1px 5px;border-radius:4px}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px}
.check .s{width:16px;height:16px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:9px;font-weight:700;background:#0C5F4C;color:var(--green)}
.check.warn .s{background:#5A4614;color:var(--amber)}
.check .x{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:11px}

/* ---------------- storylines ---------------- */
.lead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;position:relative;transition:.12s}
.lead:hover{border-color:var(--line2)}
.lead .top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.lead .kind{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  padding:3px 7px;border-radius:5px;background:var(--line);color:var(--dim)}
.lead .kind.hot{background:#5C1A24;color:#FFBFC4}
.lead .kind.cold{background:#123C57;color:#AED6FF}
.lead .kind.big{background:#0C5F4C;color:#9CF0CE}
.lead h4{font-size:15px;font-weight:700;letter-spacing:-.2px}
.lead p{font-size:13px;color:#CBDEDF;line-height:1.65;margin-top:2px}
.lead .score{margin-left:auto;font-size:10px;color:var(--dim2);font-family:var(--mono)}
.copy{position:absolute;top:12px;right:12px;opacity:0;transition:.12s}
.lead:hover .copy{opacity:1}

/* ---------------- board: the race, not a spreadsheet ---------------- */
.race-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.75fr);gap:14px}
.leader-card{position:relative;min-height:210px;padding:24px;overflow:hidden;
  background:linear-gradient(135deg,#182022 0%,var(--panel) 62%);border-color:var(--line2)}
.leader-card::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  right:-110px;top:-120px;background:var(--leader);filter:blur(4px);opacity:.13}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);font-weight:700}
.leader-name{display:flex;align-items:center;gap:12px;margin-top:18px;position:relative;z-index:1}
.leader-swatch{width:12px;height:52px;border-radius:99px;background:var(--leader)}
.leader-name h3{font-size:clamp(28px,4vw,48px);line-height:.95;letter-spacing:-1.8px}
.leader-odds{font:700 clamp(48px,7vw,78px)/1 var(--mono);letter-spacing:-4px;margin-top:18px}
.leader-caption{color:var(--dim);font-size:12px;margin-top:8px}
.race-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.race-stat{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.race-stat.wide{grid-column:1/-1}
.race-stat .value{font:700 21px/1.1 var(--mono);margin-top:8px}
.race-stat .note{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.45}
.board-list{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board-list-head,.board-row{display:grid;grid-template-columns:40px minmax(170px,1.3fr) minmax(190px,1.5fr) 90px 170px;
  align-items:center;column-gap:16px}
.board-list-head{padding:11px 18px;border-bottom:1px solid var(--line);color:var(--dim2);
  font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.board-row{position:relative;padding:15px 18px;border-bottom:1px solid #21262A;transition:.14s}
.board-row:last-child{border-bottom:none}.board-row:hover{background:var(--panel2)}
.board-row::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
  border-radius:0 3px 3px 0;background:var(--person)}
.board-row.out{opacity:.58}.board-row.out::before{background:var(--dim2)}
.board-rank{font:700 18px/1 var(--mono);color:var(--dim)}
.board-person{min-width:0}.board-person .person-name{font-size:17px;font-weight:700;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-person .person-name:hover{color:var(--green)}
.board-person .person-meta{font-size:11px;color:var(--dim);margin-top:3px}
.odds-block{min-width:0}.odds-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.odds-value{font:700 24px/1 var(--mono)}
.odds-bar{height:5px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.odds-bar i{display:block;height:100%;width:var(--odds);background:var(--person);border-radius:99px}
.change{font:700 13px var(--mono);text-align:right}.change small{display:block;font:500 10px var(--sans);color:var(--dim);margin-top:3px}
.season-trace{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.season-trace .facts{text-align:right;font-size:11px;color:var(--dim);line-height:1.55}
.season-trace .facts b{color:var(--ink);font-family:var(--mono)}
.board-extras{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:14px;margin-top:14px}

/* ---------------- storylines: an editorial front page ---------------- */
.story-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}
.story-intro h2{font-size:clamp(28px,4vw,46px);letter-spacing:-1.4px;line-height:1}
.story-intro p{max-width:460px;color:var(--dim);font-size:12px;line-height:1.55}
.lead.hero{padding:24px;min-height:210px;border-color:#416269;
  background:linear-gradient(135deg,#11373B 0%,var(--panel) 68%)}
.lead.hero h4{font-size:clamp(25px,4vw,42px);line-height:1.05;letter-spacing:-1.2px;max-width:820px}
.lead.hero p{font-size:15px;max-width:920px;margin-top:14px}
.lead.hero .kind{background:#D8F2F0;color:#07383D}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.lead.featured{margin:0;min-height:175px;padding:19px}.lead.featured h4{font-size:20px;line-height:1.15}
.briefs{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brief{display:grid;grid-template-columns:42px 130px 1fr auto;align-items:start;gap:14px;
  padding:15px 16px;border-bottom:1px solid #21262A}.brief:last-child{border-bottom:none}
.brief .index{font:700 13px var(--mono);color:var(--dim2)}
.brief h4{font-size:14px}.brief p{color:var(--dim);font-size:12px;line-height:1.55;margin-top:3px}
.brief .copy{position:static;opacity:1}
.chart-empty{min-height:320px;display:grid;place-items:center;text-align:center;color:var(--dim);
  border:1px dashed var(--line2);border-radius:10px;padding:28px;line-height:1.6}

/* ---------------- narrow screens ----------------
   Navigation becomes a deliberate two-row dock. The main event uses cards,
   so the phone view has no standings table to pan sideways. */
#navToggle{display:none}
@media (max-width:860px){
  body{display:block;overflow:hidden}
  aside{position:fixed;left:0;right:0;bottom:0;z-index:60;width:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    border:0;border-top:1px solid #ffffff25;background:linear-gradient(180deg,#004C54,#003B41)}
  aside .brand,aside .weekpick,aside .side-foot,nav .sep{display:none}
  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  nav button{min-width:0;justify-content:center;flex-direction:column;gap:2px;padding:5px 3px;
    font-size:10px;line-height:1.1;text-align:center}
  nav button .ic{width:auto;font-size:14px}nav button .k{display:none}
  main{height:100%;padding-bottom:100px}
  header{gap:8px;height:auto;min-height:58px;padding:9px 12px;align-items:center}
  header > div:first-of-type{flex:1;min-width:0}
  header h2{font-size:15px;white-space:normal}
  header .sub{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pills{display:none}
  #runBtn{font-size:10px;padding:6px 8px;white-space:nowrap}
  .scroll{padding:14px 12px 22px}
  .grid.g3,.grid.g2,.race-hero,.board-extras,.lead-grid{grid-template-columns:1fr}
  .drawer{width:100%;max-width:100%}
  .leader-card{min-height:190px;padding:20px}.leader-odds{font-size:52px}
  .race-summary{grid-template-columns:1fr 1fr}.race-stat.wide{grid-column:1/-1}
  .board-list-head{display:none}
  .board-row{grid-template-columns:32px minmax(0,1fr) auto;padding:14px 14px 14px 17px;gap:10px}
  .board-person .person-name{font-size:15px}.board-person .person-meta{font-size:10px}
  .odds-block{grid-column:2/4}.odds-line{justify-content:flex-start}.odds-value{font-size:22px}
  .odds-bar{margin-top:7px}.change{grid-column:3;grid-row:1;text-align:right}
  .season-trace{grid-column:2/4;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px}
  .season-trace .facts{text-align:left}.season-trace svg{width:92px;height:24px}
  .story-intro{display:block}.story-intro p{margin-top:10px}.lead.hero{padding:19px;min-height:0}
  .lead.hero h4{font-size:27px}.lead.featured{min-height:0}
  .lead .copy{position:static;opacity:1;margin-top:14px}
  .brief{grid-template-columns:32px 1fr auto;gap:9px}.brief .kind{display:none}.brief .copy{grid-column:3;grid-row:1}
  .checks{grid-template-columns:1fr!important}
  .card{padding:14px}.card table{font-size:11px}
  .pickmatrix{min-width:820px}.pick-scroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
  .wif{display:grid;grid-template-columns:24px 1fr auto}.wif .lbl{min-width:0}.wif .seg{grid-column:2}.wif .lev{grid-column:3;grid-row:1}
}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--line2);z-index:50;transform:translateX(100%);transition:.22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer .db{flex:1;overflow-y:auto;padding:18px 20px}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  font-weight:700;font-size:15px;color:#00171A}

.pickgrid{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.pickgrid div{aspect-ratio:1;border-radius:3px;display:grid;place-items:center;
  font-size:8px;font-weight:700;font-family:var(--mono)}
.hit{background:#0C5F4C;color:#9CF0CE}.miss{background:#5C1A24;color:#FFBFC4}
.pend{background:var(--line);color:var(--dim2)}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #21262A;font-size:13px}
.kv:last-child{border:none}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;font-family:var(--mono)}

/* ---------------- what if ---------------- */
.wif{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.wif .lbl{font-size:13px;font-weight:600;min-width:150px}
.seg{display:inline-flex;background:var(--bg);border-radius:7px;padding:2px;border:1px solid var(--line)}
.seg button{padding:3px 11px;border-radius:5px;font-size:11px;font-weight:700;color:var(--dim2)}
.seg button.on{background:var(--line2);color:var(--ink)}
.seg button.on[data-v="W"]{background:#0C5F4C;color:#9CF0CE}
.seg button.on[data-v="L"]{background:#5C1A24;color:#FFBFC4}
.lev{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono)}
.wif.done{opacity:.94}
.wif.bye{justify-content:flex-start;color:var(--dim2);font-style:italic;
  background:transparent;border-style:dashed}
.wif .wknum{color:var(--dim2);font-size:11px;min-width:20px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--eagles);color:#fff;font-weight:700;font-size:13px;padding:10px 18px;
  border-radius:99px;z-index:99;transition:.2s;box-shadow:0 8px 30px #0008}
.toast.on{transform:translateX(-50%)}
.spark{display:block}

/* ---------------- run: verdict first, detail on demand ---------------- */
.verdict{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.verdict h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.verdict p{font-size:12.5px;color:var(--dim);margin-top:2px}
.verdict .btn{margin-left:auto;flex:none}
.vmark{width:34px;height:34px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:15px;font-weight:700}
.verdict.ok .vmark{background:#0C5F4C;color:var(--green)}
.verdict.ok{border-color:#0C5F4C}
.verdict.warn .vmark{background:#5A4614;color:var(--amber)}

.attn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);
  background:var(--panel);border:1px solid #4A3A12;margin-bottom:8px}
.attn .amark{width:20px;height:20px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:#5A4614;color:var(--amber)}
.attn .t{font-weight:600;font-size:13px}
.attn .d{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.55}
.attn .btn{margin-left:auto;flex:none}

.disc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-top:10px;overflow:hidden}
.disc > summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;
  display:flex;align-items:center;gap:8px}
.disc > summary::-webkit-details-marker{display:none}
.disc > summary::before{content:"▸";font-size:11px;color:var(--dim2);transition:.15s}
.disc[open] > summary::before{transform:rotate(90deg)}
.disc > summary span{margin-left:auto;font-size:10px;text-transform:none;
  letter-spacing:0;color:var(--dim2);font-weight:500}
.disc > summary:hover{color:var(--ink)}
.disc > *:not(summary){padding:0 16px 16px}

/* ---------------- control room ----------------
   Only reachable when the page is served by dashboard/serve.py. Opened as a
   file it has no origin and none of this appears. */
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{background:#7A2130}
.btn.danger:hover{background:#8E2839}
.btn.armed{background:#F2B33D;color:#0C0E10}
.log{font-family:var(--mono);font-size:11px;line-height:1.65;color:#B7C4CB;
  background:#08090A;border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;margin-top:14px;max-height:360px;overflow:auto;
  white-space:pre-wrap;word-break:break-word}
.log.bad{border-color:#7A2130;color:#FFC2C7}
.log b{color:var(--ink);font-weight:700}
.spin{display:inline-block;width:11px;height:11px;border-radius:99px;
  border:2px solid #ffffff44;border-top-color:#fff;margin-right:7px;
  vertical-align:-1px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{border:1px dashed var(--line2);border-radius:10px;padding:16px;margin-top:12px;
  text-align:center;font-size:12px;color:var(--dim);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--green);color:var(--ink)}

/* ---------------- picks matrix ---------------- */
.pickmatrix{font-size:12px;min-width:900px}
.pickmatrix th{padding-bottom:10px}
.pickmatrix td{padding:5px 6px;border-bottom:1px solid #1B1F23}
.pickmatrix .wknum{color:var(--dim2);width:26px}
.pickmatrix .matchup{white-space:nowrap;display:flex;align-items:center;gap:5px;padding-right:14px}
/* Fill comes from the team table inline; every colour in it is chosen so
   white clears AA here, so the ink is fixed. The hairline is what keeps the
   near-black teams -- Raiders, Bengals, Saints, Steelers, Panthers -- reading
   as a chip rather than as a hole in a card that is itself nearly black. */
.team{display:inline-grid;place-items:center;min-width:38px;padding:2px 5px;border-radius:4px;
  background:#22282C;color:#fff;font-size:9.5px;font-weight:700;font-family:var(--mono);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pickmatrix .res{margin-left:2px}
.pk{text-align:center;font-weight:700;font-family:var(--mono);font-size:10.5px;width:38px}
.pk-hit{color:#5FE0A6}.pk-miss{color:#FF8A93}.pk-todo{color:#454B50}
.pickmatrix tr.bye td{text-align:center;background:var(--eagles);color:#CFE6E8;
  font-weight:700;font-size:10px;letter-spacing:.14em;padding:5px;border-radius:5px}
.pickmatrix tfoot td{padding-top:9px;color:var(--dim);font-size:11px;border:none}
.pickmatrix tfoot tr.foot td:nth-child(2){font-weight:600}
.pickmatrix tfoot td.num{text-align:center;color:var(--ink);font-weight:600}
.split{position:relative;height:16px;border-radius:5px;background:#5C1A24;overflow:hidden;
  display:flex;align-items:center}
.split i{position:absolute;left:0;top:0;bottom:0;background:#0C5F4C}
.split span{position:relative;font-size:9px;font-weight:700;font-family:var(--mono);
  padding:0 5px;color:#E9ECEE}
.split span:last-child{margin-left:auto}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="mark fallback" id="mark">FEP</div>

  aria-labelledby="drawerName" tabindex="-1" hidden></div>

__LIVE__
<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
// chart.py is the only palette authority. The mapping is baked into the page,
// so removing or reordering a person cannot change anyone else's identity.
const color = n => D.colors[n] || '#69737B';
// Near-black or white on a swatch, whichever actually reads. Measured, not
// thresholded: the yellow-greens sit right on the boundary.
const _lum = h => {const f=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
  return .2126*f(parseInt(h.slice(1,3),16))+.7152*f(parseInt(h.slice(3,5),16))+.0722*f(parseInt(h.slice(5,7),16));};
const _ratio=(a,b)=>{const x=_lum(a),y=_lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const ink = n => _ratio('#0C0E10',color(n))>=_ratio('#FFFFFF',color(n)) ? '#0C0E10' : '#FFFFFF';
// Lift the canonical colour for a legible stroke without changing its hue.
const line = n => {const h=color(n), mix=c=>Math.round(parseInt(c,16)*.65+255*.35).toString(16).padStart(2,'0');
  return '#'+mix(h.slice(1,3))+mix(h.slice(3,5))+mix(h.slice(5,7));};
const pct = v => (v===null||v===undefined) ? "--" : v.toFixed(1)+"%";
const sgn = v => (v>0?"+":"")+v.toFixed(1);
// Competitor names come from a Google Sheet and game labels from an ESPN
// response. Neither is authored here, and both are interpolated into innerHTML
// all over this file, so both get escaped at the point of use.
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// The 32 NFL teams, baked in from fep/teams.py: ESPN's scoreboard abbreviation
// and a primary colour that white text clears AA against. This page used to
// take the first three letters of a nickname instead, which reads COM, STE and
// 49E -- none of which is what a scoreboard says.
const TEAMS = D.teams || {};
// "vs. Jaguars (London)" and "@ Titans" each name one team; the rest of the
// label is schedule, so it comes off before the lookup.
const teamName = v => String(v==null?'':v).replace(/\([^)]*\)/g,'')
  .replace(/^\s*(vs\.?|@|at)\s+/i,'').trim();
const teamAbbr = t => (TEAMS[teamName(t)]||{}).abbr || teamName(t).slice(0,3).toUpperCase();
// A team the table does not know reads as plainly unstyled rather than
// borrowing somebody else's colour.
const teamColor = t => (TEAMS[teamName(t)]||{}).color || '#22282C';
const teamChip = t =>
  `<span class="team" style="background:${teamColor(t)}">${esc(teamAbbr(t))}</span>`;

/* ---------- shell ---------- */
const played = D.games.filter(g=>g.result!=='A');
const wins = played.filter(g=>g.result==='W').length;
const rec = wins+"-"+(played.length-wins);
const next = D.games.find(g=>g.result==='A');
// Week 0 is a real state, not an error: every sheet is in and nothing has been
// played yet. Everything below that describes "the last result" or "the move
// since last week" has no referent until the opener, so it branches on this.
const PRESEASON = played.length===0;
const last = PRESEASON ? null : played[played.length-1];
// Heat Check is empty in week 0 and in any week with no prior snapshot.
const DELTAS = Object.entries((D.heat&&D.heat.deltas)||{});
const movers = DELTAS.slice().sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));

document.getElementById('brandSub').textContent = D.year+" season";
// Use the real FEP wordmark when it is present, otherwise keep the text mark.
(function(){
  const m=document.getElementById('mark'), i=new Image();
  i.onload=()=>{
    m.textContent=''; m.classList.remove('fallback'); m.appendChild(i);
    // The wordmark already says FEP, so the heading drops to just the app name.
    document.getElementById('brandTitle').textContent='Control';
  };
  i.onerror=()=>{};                       // keep the text mark
  i.src='assets/fep-logo.png'; i.alt='FEP';
})();
document.getElementById('wkNum').textContent = "Week "+D.week;
document.getElementById('wkRec').textContent = "Eagles "+rec;
document.getElementById('wkOpp').innerHTML = PRESEASON
  ? `<span class="wl A">·</span> ${next ? 'opens '+esc(next.label) : 'season complete'}`
  : `<span class="wl ${last.result}">${last.result}</span> ${esc(last.label)}`;
// "Still alive" is a claim about the rules, so it counts competitors with a
// possible winning outcome, not competitors with measurable odds. D.conc.alive
// is sum(weighted > 0), which is a different and weaker statement -- it drops
// anyone the model has rounded to nothing even though they can still win.
const ALIVE = D.roster.length - D.elim.eliminated.length;
const DIM = (D.elim.effectively_eliminated || []).filter(n => D.elim.eliminated.indexOf(n) < 0);
document.getElementById('fOut').textContent = D.outcomes.toLocaleString();
document.getElementById('fAlive').textContent = ALIVE+" of "+D.roster.length;
document.getElementById('fRun').textContent = D.generated;
const VIEW_META={
  board:['The Board',PRESEASON?'The opening line':`${D.outcomes.toLocaleString()} outcomes remain`],
  story:['Stories','The week, ranked by what matters'],
  picks:['The Picks',`${D.year} sheet comparison`],
  whatif:['What If','Change one result at a time'],
  chart:['Trends','Weekly movement and ten-season context'],
  run:['Build & share','Payload audit and handoff commands'],
};
// One status, not four competing ones, and it is filled in by the Run view so
// it can never disagree with the verdict it is summarising.
function setStatus(n){
  document.getElementById('hPills').innerHTML = n
    ? `<span class="pill warn"><span class="dot"></span>${n} thing${n===1?'':'s'} to look at</span>`
    : `<span class="pill ok"><span class="dot"></span>All clear</span>`;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1500);}
function copy(text,msg){navigator.clipboard.writeText(text).then(()=>toast(msg||"Copied"));}

/* ================= LIVE =================
   This page has two modes and they are decided by one fact: whether anything
   is behind it. Double-clicked from Finder it is a viewer, it has no origin,
   and every button copies the command that would do the thing. Served by
   dashboard/serve.py the same buttons perform it, because the server is
   running cli.py in a real process and handing back what it printed.

   Nothing is reimplemented here. There is one weekly run and it lives in
   cli.py; the difference is only whether you type it or click it. */
const LIVE = !!(window.FEP_LIVE && window.FEP_LIVE.token);
let STATE = null, BUSY = false;

async function api(action, extra){
  const r = await fetch('/api/action', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-FEP-Token':window.FEP_LIVE.token},
    body: JSON.stringify(Object.assign({action}, extra||{}))
  });
  return r.json();
}

function logOut(text, bad){
  const el=document.getElementById('ctlLog'); if(!el) return;
  el.hidden=false; el.classList.toggle('bad',!!bad); el.textContent=text||'';
  el.scrollTop=el.scrollHeight;
}

// The run button says which week it will record. During a bye the week the
// calendar is on and the week the scoreboard is on are different numbers, and
// a button reading only "Run the week" is exactly where that difference would
// go unnoticed.
function runLabel(){
  const s=(STATE||{}).season||{};
  if(s.next_week==null) return 'Run the week';
  return `Run week ${s.next_week}` + (s.next_is_bye ? ' (bye)' : '');
}

function setBusy(on,label){
  BUSY=on;
  document.querySelectorAll('[data-run]').forEach(b=>{b.disabled=on;});
  const rb=document.getElementById('runBtn');
  if(rb && rb.dataset.run) rb.innerHTML = on
    ? `<span class="spin"></span>${label||'Working'}`
    : runLabel();
}

// Reloading is how the page picks up a new season file. Only the actions that
// change what the board is drawn from need it: writing to the Sheet or to git
// changes the world outside this page, not the payload inside it.
const RELOADS = {week:1, refresh:1, picks:1};

async function run(action, extra, label){
  if(BUSY) return toast("Something is already running");
  setBusy(true,label);
  logOut((label||action)+' ...');
  let out;
  try{
    out = await api(action, extra);
  }catch(err){
    setBusy(false);
    return logOut("Lost the connection to the app.\n\n"+err+
      "\n\nThe window that launched it may have been closed.", true);
  }
  setBusy(false);
  if(out.state) STATE=out.state, paintState();
  const head=(out.label||action)+(out.seconds!==undefined?'  ('+out.seconds+'s)':'');
  if(!out.ok){
    logOut(head+"\n\n"+(out.error||'It did not work.')+"\n\n"+(out.log||''), true);
    return toast(out.error||"That did not work");
  }
  logOut(head+"\n\n"+(out.log||'Done.'));
  toast((out.label||'Done')+" ✓");
  if(RELOADS[action]) setTimeout(()=>location.reload(), 700);
}

/* ---- the control room, rendered into the Run tab ---- */
function controlPanel(){
  return `
  <div class="card">
    <h3>Run <span class="tag">connected to the model</span></h3>
    <p class="muted tiny" style="line-height:1.6">Each button runs the same
      <code>cli.py</code> command the terminal would, in a real process on this
      machine. What it printed appears at the bottom of this tab, unedited.</p>
    <div class="ctl">
      <button class="btn" data-run="week"
        title="Pull results and weights from ESPN, run the model, snapshot the week, write the stat pack and chart, rebuild this page, commit and push">Run the week</button>
      <button class="btn ghost" data-run="refresh" title="Results, scores and ESPN weights only. Nothing is snapshotted.">Refresh from ESPN</button>
      <button class="btn ghost" data-run="board" title="Run the model and print the board without saving anything">Run the model</button>
      <button class="btn ghost" data-run="leverage">Rank remaining games</button>
      <button class="btn ghost" data-run="rebuild" title="Write dashboard/index.html, the copy that works with the app closed">Rebuild the offline copy</button>
    </div>
  </div>

  <div class="grid g2 mt">
    <div class="card"><h3>The Sheet <span class="tag" id="ctlSheet"></span></h3>
      <p class="muted tiny" style="line-height:1.6">The push writes <code>B2:M20</code>
        and nothing else: column A keeps the week labels and column N onward keeps your
        formulas. Preview first, it prints every row it would write.</p>
      <div class="ctl">
        <button class="btn ghost" data-run="push-preview">Preview the push</button>
        <button class="btn danger" data-run="push-live"
          data-confirm="Write B2:M20 now">Write to the Sheet</button>
      </div>
    </div>
    <div class="card"><h3>CMS tables <span class="tag">seven tables</span></h3>
      <p class="muted tiny" style="line-height:1.6">The tables Framer reads. Columns are
        appended and never inserted, so a preview is worth reading before a write.</p>
      <div class="ctl">
        <button class="btn ghost" data-run="cms-preview">Preview</button>
        <button class="btn ghost" data-run="cms-csv">Export CSVs</button>
        <button class="btn danger" data-run="cms-live"
          data-confirm="Write the tables now">Write the tables</button>
      </div>
    </div>
  </div>

  <div class="card mt"><h3>The season file <span class="tag" id="ctlGit"></span></h3>
    <p class="muted tiny" style="line-height:1.6"><code>data/season_2026.json</code> is the
      only thing here that cannot be rebuilt from anything else. Every run commits it and
      sends it to GitHub; this is the button for when a push could not go out at the time.</p>
    <div class="ctl">
      <button class="btn ghost" data-run="backup">Save and back up</button>
      <button class="btn ghost" id="ctlQuit" title="Stop the server. The page stays open but its buttons stop working.">Quit the app</button>
    </div>
    <div class="drop" id="ctlDrop">
      <b>Load a pick sheet</b><br>Drop a CSV here, or click to choose one.
      <span id="ctlOutstanding"></span>
    </div>
    <input type="file" id="ctlFile" accept=".csv,text/csv" hidden>
  </div>

  <pre class="log" id="ctlLog" hidden></pre>`;
}

function paintState(){
  if(!STATE) return;
  if(!BUSY) document.querySelectorAll('[data-run="week"]')
    .forEach(b=>{b.textContent=runLabel();});
  const sheet=document.getElementById('ctlSheet');
  if(sheet) sheet.textContent = STATE.sheet && STATE.sheet.appsscript ? 'Apps Script ready'
    : (STATE.sheet && STATE.sheet.credentials ? 'service account' : 'nothing configured');
  const git=document.getElementById('ctlGit');
  if(git){
    const g=STATE.git||{};
    git.textContent = !g.dirty && !g.ahead ? 'saved and pushed'
      : [g.dirty?g.dirty+' uncommitted':'', g.ahead?g.ahead+' to push':'']
        .filter(Boolean).join(', ');
  }
  const out=document.getElementById('ctlOutstanding'), miss=(STATE.season||{}).outstanding||[];
  if(out) out.innerHTML = miss.length
    ? `<br><span style="color:var(--amber)">Still waiting on ${miss.join(', ')}.</span>`
    : `<br>All ${(STATE.season||{}).roster||12} sheets are in.`;
}

/* ---- wiring, once, for everything the control room renders later ---- */
if(LIVE){
  // A write that leaves this machine gets a second press rather than a browser
  // dialog: the button says what it is about to do and waits five seconds.
  document.body.addEventListener('click', e=>{
    const b=e.target.closest('[data-run]'); if(!b || b.disabled) return;
    const confirmText=b.dataset.confirm;
    if(confirmText && !b.classList.contains('armed')){
      const original=b.textContent;
      b.classList.add('armed'); b.textContent=confirmText;
      clearTimeout(b._arm);
      b._arm=setTimeout(()=>{b.classList.remove('armed');b.textContent=original;},5000);
      return;
    }
    if(b._arm){clearTimeout(b._arm);b.classList.remove('armed');}
    run(b.dataset.run, null, b.textContent.trim());
  });

  document.body.addEventListener('click', e=>{
    if(e.target.closest('#ctlDrop')) document.getElementById('ctlFile').click();
    if(e.target.closest('#ctlQuit')){
      fetch('/api/quit',{method:'POST',headers:{'X-FEP-Token':window.FEP_LIVE.token}})
        .catch(()=>{});
      logOut("The app is closed. This page is a viewer again until you\nreopen it from FEP.app.");
      toast("Closed");
    }
  });

  document.body.addEventListener('change', e=>{
    if(e.target.id!=='ctlFile' || !e.target.files.length) return;
    const file=e.target.files[0], reader=new FileReader();
    reader.onload=()=>run('picks',{csv:reader.result}, 'Loading '+file.name);
    reader.readAsText(file);
    e.target.value='';
  });

  ['dragover','dragleave','drop'].forEach(type=>{
    document.body.addEventListener(type, e=>{
      const zone=e.target.closest('#ctlDrop'); if(!zone) return;
      e.preventDefault();
      zone.classList.toggle('over', type==='dragover');
      if(type!=='drop') return;
      const file=(e.dataTransfer.files||[])[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>run('picks',{csv:reader.result}, 'Loading '+file.name);
      reader.readAsText(file);
    });
  });

  const rb=document.getElementById('runBtn');
  rb.className='btn'; rb.textContent='Run the week'; rb.dataset.run='week';
  rb.title='ESPN, the model, the snapshot, the stat pack, the chart, this page, and git';

  fetch('/api/state').then(r=>r.json()).then(s=>{STATE=s;paintState();}).catch(()=>{});
}

/* ---------- sparkline ---------- */
function spark(name,w=76,h=20){
  const vals=D.snapshots.map(s=>s.weighted[name]??0);
  // Nothing to trace before there are two points to trace between. Zero
  // snapshots gives an empty box; one would divide by zero, so it gets a dot.
  if(vals.length<2) return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${
    vals.length===1?`<circle cx="${(w/2).toFixed(1)}" cy="${(h/2).toFixed(1)}" r="2" fill="${line(name)}"/>`:''
  }</svg>`;
  const max=Math.max(...D.snapshots.flatMap(s=>Object.values(s.weighted)),1);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-2)+1, h-1-(v/max)*(h-2)]);
  const dead=D.elim&&D.elim.eliminated.indexOf(name)>=0;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')}"
      fill="none" stroke="${dead?'#69737B':line(name)}" stroke-width="1.6"
      stroke-linejoin="round" opacity="${dead?.5:1}"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}"
      r="2" fill="${dead?'#69737B':line(name)}"/></svg>`;
}
function rankAt(week,name){
  const s=D.snapshots.find(x=>x.week===week); if(!s) return null;
  return Object.entries(s.weighted).sort((a,b)=>b[1]-a[1]).findIndex(e=>e[0]===name)+1;
}

(function(){

  if(D.nextLev) leads.push(['big','Leverage index',
    `${D.nextLev.label} is worth ${pct(D.nextLev.leverage)} of the pool`,
    `Nearly ${Math.round(D.nextLev.leverage)} percentage points of leaderboard equity change hands on this one result. ${(()=>{

      const h=Object.entries(sw).sort((a,b)=>b[1]-a[1])[0], l=Object.entries(sw).sort((a,b)=>a[1]-b[1])[0];
      return `A win is worth ${sgn(h[1])} to ${h[0]}, and a loss is worth ${Math.abs(l[1]).toFixed(1)} to ${l[0]}.`})()}`,95]);
  if(D.elim.eliminated.length) leads.push(['cold','Obituary',
    `${D.elim.eliminated.length} ${D.elim.eliminated.length===1?'campaign is':'campaigns are'} over`,
    `${D.elim.eliminated.join(', ')} ${D.elim.eliminated.length===1?'is':'are'} mathematically eliminated. No remaining combination of results gets them there.`,80]);
  if(D.elim.eliminated_by_loss.length && D.nextLev) leads.push(['cold','On the brink',

  if(D.twins.length && D.twins[0].distance===0) leads.push(['','Redundancy',

  if(dead.length){
    const alive=D.roster.filter(n=>!D.elim.eliminated.includes(n));
    leads.push(['','Dead rubber',
      dead.length===1 ? `${dead[0].label} cannot change anything`
                      : `${dead.length} remaining games cannot change anything`,
      `${dead.map(l=>l.label).join(', ')} carr${dead.length===1?'ies':'y'} zero leverage. All ${alive.length} surviving competitors picked ${dead.length===1?'it':'them'} the same way, so the result costs or credits everyone equally and the board does not move. Whatever happens, nothing happens.`,
      68]);
  }
  const vol=Object.entries(D.vol).sort((a,b)=>b[1].total_movement-a[1].total_movement)[0];
  if(vol) leads.push(['','Volatility',`${vol[0]} has been the season's rollercoaster`,
    `${vol[0]} has covered ${vol[1].total_movement.toFixed(1)} points of total movement, peaking at ${pct(vol[1].peak)} in Week ${vol[1].peak_week}.`,50]);

  leads.sort((a,b)=>b[4]-a[4]);
  const hero=leads[0], features=leads.slice(1,3), briefs=leads.slice(3);
  document.getElementById('v-story').innerHTML = `
  <div class="story-intro">
    <div><div class="eyebrow">Week ${D.week} news desk</div><h2>The week in one glance</h2></div>
    <p>Ranked from the model output by newsworthiness. Copy any lead, then edit it into your own voice.</p>
  </div>
  ${hero?`<article class="lead hero">
    <div class="top"><span class="kind ${hero[0]}">${esc(hero[1])}</span><span class="score">Lead story</span></div>
    <h4>${esc(hero[2])}</h4><p>${esc(hero[3])}</p>
    <button class="btn ghost sm copy" data-c="0">Copy lead</button></article>`:''}
  <div class="lead-grid">${features.map((L,i)=>`<article class="lead featured">
    <div class="top"><span class="kind ${L[0]}">${esc(L[1])}</span><span class="score">0${i+2}</span></div>
    <h4>${esc(L[2])}</h4><p>${esc(L[3])}</p>
    <button class="btn ghost sm copy" data-c="${i+1}">Copy</button></article>`).join('')}</div>
  ${briefs.length?`<div class="briefs">${briefs.map((L,i)=>`<article class="brief">
    <span class="index">${String(i+4).padStart(2,'0')}</span><span class="kind ${L[0]}">${esc(L[1])}</span>
    <div><h4>${esc(L[2])}</h4><p>${esc(L[3])}</p></div>
    <button class="btn ghost sm copy" data-c="${i+3}">Copy</button></article>`).join('')}</div>`:''}
  <div class="card mt"><h3>Full stat pack</h3>
    <p class="muted tiny">Everything above plus the tables, as markdown, ready for the newsletter draft.</p>
    <button class="btn ghost sm" style="margin-top:10px" id="copyPack">Copy stat pack markdown</button></div>`;

  document.getElementById('v-story').addEventListener('click',e=>{
    const b=e.target.closest('[data-c]'); if(!b) return;
    const L=leads[+b.dataset.c]; copy(L[2]+". "+L[3],"Lead copied");
  });
  document.getElementById('copyPack').onclick=()=>copy(
    `# ${D.year} FEP | Week ${D.week}\n\n`+leads.map(L=>`**${L[2]}**\n${L[3]}\n`).join('\n'),
    "Stat pack copied");
})();

/* ================= WHAT IF ================= */
(function(){
  const levBy=Object.fromEntries(D.leverage.map(l=>[l.game_index,l.leverage]));
  const retroBy=Object.fromEntries((D.retro||[]).map(r=>[r.game_index,r.magnitude]));
  // Reality for each game: the actual result if it has been played, otherwise
  // unresolved. Every control starts here and returning to it is the reset.
  const reality = Object.fromEntries(D.games.map(g=>[g.i, g.result==='A' ? '?' : g.result]));
  const byeWeek = (()=>{const ws=D.games.map(g=>g.week);
    for(let w=1;w<=18;w++) if(!ws.includes(w)) return w; return null;})();

  const rows=[];
  for(let w=1;w<=18;w++){
    if(w===byeWeek){ rows.push(`<div class="wif bye"><span class="wknum num">${w}</span>
      <span class="lbl">Bye week</span></div>`); continue; }
    const g=D.games.find(x=>x.week===w); if(!g) continue;
    const done=g.result!=='A';
    const mag=done?retroBy[g.i]:levBy[g.i];
    // A played game is pre-set to what actually happened, so there is no "?"
    // to offer: the two options are reality and the season that did not happen.
    const seg = done
      ? `<button data-v="W" class="${g.result==='W'?'on':''}">W</button>
         <button data-v="L" class="${g.result==='L'?'on':''}">L</button>`
      : `<button data-v="W">W</button><button data-v="?" class="on">?</button>
         <button data-v="L">L</button>`;
    rows.push(`<div class="wif ${done?'done':''}">
      <span class="wknum num">${w}</span>
      <span class="lbl">${esc(g.label)}</span>
      <span class="seg" data-i="${g.i}">${seg}</span>
      <span class="lev" title="${done?'what this result actually cost':'equity that swings on this result'}">${mag!==undefined?pct(mag):''}</span></div>`);
  }

  document.getElementById('v-whatif').innerHTML=`
  <div class="grid g12">
    <div class="card"><h3>Force a result
        <span class="tag">played games are set to what happened; change one to see the season that did not</span></h3>
      ${rows.join('')}
      <p class="muted tiny" style="margin-top:10px;line-height:1.6">
        The percentage on the right is leverage for games still to come, and for games
        already played it is what that result actually cost the field.</p>
    </div>
    <div>
      <div class="card" style="position:sticky;top:0"><h3>Board <span class="tag" id="wifState">as it stands</span></h3>
        <table><tbody id="wifBody"></tbody></table>
        <button class="btn ghost sm" id="wifReset" style="width:100%;margin-top:12px;display:none">Reset to reality</button>
        <p class="muted tiny" style="margin-top:10px;line-height:1.6" id="wifNote"></p></div>
    </div>
  </div>`;

  function paint(board,label,note){
    document.getElementById('wifState').textContent=label;
    document.getElementById('wifNote').textContent=note||'';
    document.getElementById('wifReset').style.display=note?'block':'none';
    document.getElementById('wifBody').innerHTML=D.roster.slice()
      .sort((a,b)=>board[b]-board[a]).map(n=>{
        const d=board[n]-D.board[n];
        return `<tr><td><span class="pillname" data-n="${esc(n)}"
          style="background:${color(n)};color:${ink(n)}">${esc(n)}</span></td>
          <td class="r num" style="font-weight:700">${pct(board[n])}</td>
          <td class="r num tiny ${d>0.05?'up':d<-0.05?'down':'flat'}">${Math.abs(d)>0.05?sgn(d):''}</td></tr>`;}).join('');
  }
  function toReality(){
    document.querySelectorAll('#v-whatif .seg').forEach(seg=>{
      const want=reality[+seg.dataset.i];
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===want));
    });
    paint(D.board,'as it stands','');
  }
  toReality();

  document.getElementById('v-whatif').addEventListener('click',e=>{
    if(e.target.id==='wifReset') return toReality();
    const b=e.target.closest('.seg button'); if(!b) return;
    const seg=b.parentElement, i=+seg.dataset.i, v=b.dataset.v;

    if(v===reality[i]) return toReality();   // back to what really happened

    // One change at a time: the precomputed boards are exact single-game
    // counterfactuals, and stacking two would not be one.
    document.querySelectorAll('#v-whatif .seg').forEach(s=>{
      const want = s===seg ? v : reality[+s.dataset.i];
      s.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.v===want));
    });

    const g=D.games.find(x=>x.i===i);
    const alt=(D.whatif||{})[i];
    if(!alt||!alt[v]) return paint(D.board,'as it stands','No precomputed board for that game.');
    const done=g.result!=='A';
    paint(alt[v],
      done ? `if ${esc(g.label)} had been a ${v}` : `if the Eagles ${v==='W'?'win':'lose'} ${esc(g.label)}`,
      done ? `Week ${g.week} really finished ${g.result}. This is the season that did not happen.`
           : `Week ${g.week} has not been played. This is one of the two ways it can go.`);
  });
})();

<div class="card"><h3>${PRESEASON?'The trend starts after the opener':`Week ${D.week} chart`} <span class="tag">same renderer used for Framer</span></h3>

        <tbody>${rows.map((r,i)=>`<tr><td class="muted num">${i}</td>${r.map(v=>`<td class="r num tiny ${v===''?'muted':''}">${v||'·'}</td>`).join('')}</tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="card"><h3>Chart data</h3>
      <div class="kv"><span>File</span><span>chart-data/${D.year}/week-0${D.week}.json</span></div>

      <div class="kv"><span>Framer week prop</span><span>${D.week}</span></div>

  else pb.onclick=()=>copy("python3 cli.py push --live","Push command copied");

(function(){
  const champs=D.champions;
  document.getElementById('historyMount').innerHTML=`
  <div class="grid g2">
    <div class="card"><h3>Ten seasons</h3>
      <table><thead><tr><th>Year</th><th>Champion</th><th class="r">Score</th><th class="r">Field avg</th><th>Eagles</th></tr></thead>

        <td><span class="pillname" ${D.roster.includes(c.champion)?`data-n="${esc(c.champion)}"`:''} style="background:${color(c.champion)};color:${ink(c.champion)}">${esc(c.champion)}</span></td>
        <td class="r num" style="font-weight:700">${c.winning_score}</td>
        <td class="r num muted">${c.field_average}</td>

    <div class="card"><h3>Context for this week</h3>

      <div class="kv"><span>Lowest ever</span><span>${Math.min(...champs.map(c=>c.winning_score))} (${champs.find(c=>c.winning_score===Math.min(...champs.map(x=>x.winning_score))).year})</span></div>
      <div class="kv"><span>Highest ever</span><span>${Math.max(...champs.map(c=>c.winning_score))} (${champs.find(c=>c.winning_score===Math.max(...champs.map(x=>x.winning_score))).year})</span></div>
      <div class="kv"><span>Unique champions</span><span>${new Set(champs.map(c=>c.champion)).size} of 10</span></div>
      <div class="kv"><span>Leader's pace</span><span>${PRESEASON?'—':(D.correct[D.ranked[0]]/played.length*17).toFixed(1)}</span></div>

        correct has won it, ${Math.max(...champs.map(c=>c.winning_score))} has been needed.</p>`
      :`<p class="muted tiny" style="margin-top:12px;line-height:1.6">${esc(D.ranked[0])} is on pace for
        ${(D.correct[D.ranked[0]]/played.length*17).toFixed(1)} correct picks, which would have won

/* ================= DRAWER ================= */
function openDrawer(name){
  const c=D.career[name]||{}, p=D.personality[name]||{}, d=D.diff[name]||{};
  const lineText=`${name} sits at ${pct(D.board[name])} with ${D.correct[name]} correct picks, ${
    D.heat.deltas[name]>0?'up':'down'} ${Math.abs(D.heat.deltas[name]||0).toFixed(1)} on the week.`;
  const picks=D.picks[name].map((v,i)=>{
    const g=D.games[i];
    const cls=g.result==='A'?'pend':(v===g.result?'hit':'miss');
    return `<div class="${cls}" title="${esc(g.label)}: picked ${v}${g.result!=='A'?', actual '+g.result:''}">${v}</div>`;}).join('');
  document.getElementById('drawer').innerHTML=`
    <div class="dh"><div class="avatar" style="background:${color(name)};color:${ink(name)}">${esc(name[0])}</div>
      <div><div id="drawerName" style="font-weight:700;font-size:16px">${esc(name)}</div>
        <div class="tiny muted">${pct(D.board[name])} to win · ${D.correct[name]} correct · rank ${D.ranked.indexOf(name)+1}</div></div>
      <button class="btn ghost sm" style="margin-left:auto" onclick="closeDrawer()">Close</button></div>
    <div class="db">
      <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:8px">Season sheet</h3>
      <div class="pickgrid">${picks}</div>
      <p class="tiny muted" style="margin-top:8px">Green hit, red missed, grey still to come.</p>
      <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px">This season</h3>
      <div class="kv"><span>Odds</span><span>${pct(D.board[name])}</span></div>
      <div class="kv"><span>Change this week</span><span class="${D.heat.deltas[name]>0?'up':D.heat.deltas[name]<0?'down':''}">${sgn(D.heat.deltas[name]||0)}</span></div>
      <div class="kv"><span>Expected final</span><span>${D.expected[name].toFixed(2)}</span></div>
      <div class="kv"><span>Floor / ceiling</span><span>${D.span[name].worst} / ${D.span[name].best}</span></div>
      <div class="kv"><span>Predicted record</span><span>${D.picks[name].filter(x=>x==='W').length}-${17-D.picks[name].filter(x=>x==='W').length}</span></div>
      <div class="kv"><span>Points guess</span><span>${D.guesses[name]}</span></div>
      <div class="kv"><span>Closest rival</span><span>${esc(d.nearest||'—')} (${d.nearest_distance??'—'} apart)</span></div>
      <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px">Career</h3>
      <div class="kv"><span>Seasons</span><span>${(c.seasons||[]).length}</span></div>
      <div class="kv"><span>Titles</span><span>${c.championships??'—'}${c.title_years&&c.title_years.length?' ('+c.title_years.join(', ')+')':''}</span></div>
      <div class="kv"><span>Best / worst finish</span><span>${c.best_finish??'—'} / ${c.worst_finish??'—'}</span></div>
      <div class="kv"><span>Average correct</span><span>${c.average_correct??'—'}</span></div>
      <div class="kv"><span>Optimism</span><span>${p.optimism!==undefined?sgn(p.optimism)+' wins':'—'}</span></div>
      <div class="kv"><span>Contrarian rate</span><span>${p.contrarian_rate!==undefined?p.contrarian_rate+'%':'—'}</span></div>
      <button class="btn ghost sm" id="copyLine" style="margin-top:16px;width:100%">Copy a ready-made line</button>
    </div>`;
  const dr=document.getElementById('drawer');
  // Remember who opened it, so focus goes back there on close rather than to
  // the top of the document.
  drawerOpener = document.activeElement;
  dr.hidden = false;
  dr.classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('copyLine').onclick=()=>copy(lineText,"Line copied");
  // Focus the panel itself; the heading is read out via aria-labelledby.
  dr.focus();
}
let drawerOpener = null;
function drawerFocusables(){
  return [...document.getElementById('drawer')
    .querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(e=>e.offsetParent!==null);
}
function closeDrawer(){
  const dr=document.getElementById('drawer');
  if(!dr.classList.contains('on')) return;
  dr.classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  // Hidden only after the slide-out, so the transition still runs.
  setTimeout(()=>{ if(!dr.classList.contains('on')) dr.hidden = true; }, 240);
  if(drawerOpener && drawerOpener.focus) drawerOpener.focus();
  drawerOpener = null;
}
// Tab must not walk out of a modal panel into the page behind it.
document.getElementById('drawer').addEventListener('keydown', e=>{
  if(e.key!=='Tab') return;
  const f=drawerFocusables();
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===e.currentTarget)){
    e.preventDefault(); last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault(); first.focus();
  }
});
document.getElementById('scrim').onclick=closeDrawer;
document.body.addEventListener('click',e=>{const n=e.target.closest('[data-n]');if(n)openDrawer(n.dataset.n);});

// Served, the header button runs the week (wired in the live layer above).
// Opened as a file it can only hand over the command that would.
if(!LIVE) document.getElementById('runBtn').onclick=()=>
  copy(`python3 cli.py week && python3 cli.py dashboard`,"Rebuild command copied");

// Every view has rendered by now, so a tab remembered from before a reload can
// be restored without racing whatever was still painting itself.
(function(){const v=(location.hash||'').replace('#','');if(VIEW_META[v])show(v);})();
