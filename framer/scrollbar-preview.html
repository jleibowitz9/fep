<!doctype html>
<meta charset=utf-8><title>FEP scrollbar</title>
<!-- Generated from framer/Scrollbar.tsx. Open it to see the bar before wiring
     the override into Framer; edit the constants in the .tsx, not here. -->
<style>
body{margin:0;background:#062b28;font-family:system-ui;color:#cfe;padding:34px 40px}
h3{font:700 13px system-ui;letter-spacing:.08em;margin:0 0 4px;color:#8ecfc6}
p{font:12px system-ui;color:#6d9a94;margin:0 0 12px}
.row{display:flex;gap:12px;overflow-x:scroll;padding-bottom:16px}
.card{flex:none;width:150px;height:170px;border-radius:14px;display:grid;
  place-items:center;font:700 22px system-ui;color:#2c6b62;
  background:linear-gradient(160deg,#0e3f3a,#0a302c);border:1px solid #ffffff14}

[data-fep-bar], [data-fep-bar] * {
  scrollbar-width: thin;                                   /* Firefox */
  scrollbar-color: rgba(255,255,255,0.70) rgba(255,255,255,0.10);
}
[data-fep-bar]::-webkit-scrollbar,
[data-fep-bar] *::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}
[data-fep-bar]::-webkit-scrollbar-track,
[data-fep-bar] *::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.10);
  border-radius: 4px;
  /* Holds the track back from both ends, so it reads as an element on the
     page rather than as the edge of the window. */
  margin: 0 40px;
}
[data-fep-bar]::-webkit-scrollbar-thumb,
[data-fep-bar] *::-webkit-scrollbar-thumb {
  background-color: rgba(255,255,255,0.70);
  border-radius: 2px;
  /* A transparent border plus content-box clipping is how you get padding on
     a scrollbar thumb: there is no padding property on this pseudo-element. */
  border: 2px solid transparent;
  background-clip: content-box;
}
[data-fep-bar]::-webkit-scrollbar-thumb:hover,
[data-fep-bar] *::-webkit-scrollbar-thumb:hover {
  background-color: rgba(255,255,255,0.85);
}
[data-fep-bar]::-webkit-scrollbar-corner,
[data-fep-bar] *::-webkit-scrollbar-corner { background: transparent; }
</style>
<h3>STYLED</h3>
<p>8px track at rgba(255,255,255,0.10), 4px fill at rgba(255,255,255,0.70),
   2px all round, held 40px back from each end.</p>
<div class="row" data-fep-bar><div class=card>1</div><div class=card>2</div><div class=card>3</div><div class=card>4</div><div class=card>5</div><div class=card>6</div><div class=card>7</div><div class=card>8</div><div class=card>9</div><div class=card>10</div><div class=card>11</div><div class=card>12</div><div class=card>13</div><div class=card>14</div></div>
<h3 style="margin-top:30px">DEFAULT</h3>
<p>What the browser draws on its own.</p>
<div class="row"><div class=card>1</div><div class=card>2</div><div class=card>3</div><div class=card>4</div><div class=card>5</div><div class=card>6</div><div class=card>7</div><div class=card>8</div><div class=card>9</div><div class=card>10</div><div class=card>11</div><div class=card>12</div><div class=card>13</div><div class=card>14</div></div>
